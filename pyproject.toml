[project]
name = "pvm-python"
version = "0.1.0"
description = "Testing"
authors = [
    {name = "IgorM",email = "ingc@mail.ru"}
]
license = {text = "n"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "selenium (>=4.39.0,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "allure-pytest (>=2.15.2,<3.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-sugar (>=1.1.1,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-html (>=4.1.1,<5.0.0)"
]
